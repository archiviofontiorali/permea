<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />

        <title>{{ title | default('app') }}</title>

        <script src="https://unpkg.com/feather-icons"></script>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>

    <body class="font-sans bg-white text-black h-screen flex flex-col">
        <header
            id="header"
            class="border border-darkgray mt-2 mx-2 p-2"
        ></header>

        <main
            id="main"
            class="flex-1 flex flex-row flex-wrap m-2 border border-darkgray"
        >
            <section class="button-group w-full flex flex-row justify-center">
                <button
                    hx-post="/add-row"
                    hx-swap="beforeend"
                    hx-target="#board-search"
                    hx-on::after-request="feather.replace()"
                    class="border-2 p-2 m-1"
                >
                    Add card
                </button>
            </section>

            <section
                id="board-search"
                class="w-full md:w-1/3 min-h-24 flex flex-row md:flex-col bg-green-500"
            ></section>
            <section
                id="board-canvas"
                class="relative w-full md:w-2/3 min-h-100 bg-blue-500"
            >
                <svg
                    width="100%"
                    height="100%"
                    class="absolute border-2 border-blue-800"
                >
                    <line
                        id="svgLine"
                        x1="0"
                        x2="40"
                        y1="0"
                        y2="100"
                        style="stroke: black"
                    />
                </svg>
            </section>
        </main>

        <footer id="footer"></footer>
        <script src="https://unpkg.com/htmx.org@2.0.4"></script>
        <script src=" https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js "></script>
        <script src="https://unpkg.com/interactjs/dist/interact.min.js"></script>

        <script>
            feather.replace();
        </script>

        <script type="module">
            const canvas = document.getElementById("board-canvas");

            interact("#board-canvas > .card")
                .resizable({
                    // inertia: true,
                    edges: { left: true, right: true, bottom: true, top: true },
                    modifiers: [
                        // keep the edges inside the parent
                        interact.modifiers.restrictEdges({
                            outer: "parent",
                        }),

                        // minimum size
                        interact.modifiers.restrictSize({
                            min: { width: 100, height: 50 },
                        }),
                    ],
                    listeners: {
                        move(event) {
                            const target = event.target;
                            let x =
                                parseFloat(target.getAttribute("data-x") || 0) +
                                event.deltaRect.left;
                            let y =
                                parseFloat(target.getAttribute("data-y") || 0) +
                                event.deltaRect.top;

                            target.style.width = `${event.rect.width}px`;
                            target.style.height = `${event.rect.height}px`;

                            target.style.transform = `translate(${x}px, ${y}px)`;
                            target.setAttribute("data-x", x);
                            target.setAttribute("data-y", y);
                        },
                    },
                })
                .draggable({
                    inertia: true,
                    autoScroll: true,
                    modifiers: [
                        interact.modifiers.restrictRect({
                            restriction: "parent",
                            endOnly: true,
                        }),
                        interact.modifiers.snap({
                            targets: [interact.snappers.grid({ x: 30, y: 30 })],
                            range: Infinity,
                            relativePoints: [{ x: 0, y: 0 }],
                        }),
                    ],
                    listeners: {
                        move(event) {
                            const target = event.target;
                            let x =
                                parseFloat(target.getAttribute("data-x") || 0) +
                                event.dx;
                            let y =
                                parseFloat(target.getAttribute("data-y") || 0) +
                                event.dy;
                            target.style.transform = `translate(${x}px, ${y}px)`;
                            target.setAttribute("data-x", x);
                            target.setAttribute("data-y", y);

                            const line = document.getElementById("svgLine");
                            if (line) {
                                line.setAttribute("x2", `${x}px`);
                                line.setAttribute("y2", `${y}px`);
                            }
                        },
                    },
                });
        </script>
    </body>
</html>
