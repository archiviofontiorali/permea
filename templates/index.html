<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />

        <title>{{ title | default('app') }}</title>

        <script src="https://unpkg.com/feather-icons"></script>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
            defer
        ></script>
    </head>

    <body class="font-sans text-black w-screen h-screen bg-slate-800">
        <section
            class="fixed z-1 w-1/2 left-1/4 h-16 button-group flex flex-row justify-center border-2 bg-white"
        >
            <button
                hx-post="/add-row"
                hx-swap="beforeend"
                hx-target="#board-search"
                hx-on::after-request="feather.replace()"
                class="border-2 p-2 m-1"
            >
                Add card
            </button>
        </section>

        <section
            id="board-search"
            class="fixed z-1 w-50 h-1/2 top-1/4 flex flex-row md:flex-col border-2 bg-white"
        ></section>

        <section id="board-canvas" class="relative w-full h-full">
            <svg
                width="100%"
                height="100%"
                class="absolute border-2 border-blue-800"
            ></svg>
        </section>

        <script src="https://unpkg.com/htmx.org@2.0.4"></script>
        <script src=" https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js "></script>
        <script src="https://unpkg.com/interactjs/dist/interact.min.js"></script>

        <script>
            feather.replace();
        </script>

        <script type="module">
            const canvas = document.getElementById("board-canvas");

            interact("#board-canvas > .card")
                .resizable({
                    // inertia: true,
                    edges: { left: true, right: true, bottom: true, top: true },
                    modifiers: [
                        // keep the edges inside the parent
                        interact.modifiers.restrictEdges({
                            outer: "parent",
                        }),

                        // minimum size
                        interact.modifiers.restrictSize({
                            min: { width: 100, height: 50 },
                        }),
                    ],
                    listeners: {
                        move(event) {
                            const target = event.target;
                            let x =
                                parseFloat(target.getAttribute("data-x") || 0) +
                                event.deltaRect.left;
                            let y =
                                parseFloat(target.getAttribute("data-y") || 0) +
                                event.deltaRect.top;

                            target.style.width = `${event.rect.width}px`;
                            target.style.height = `${event.rect.height}px`;

                            target.style.transform = `translate(${x}px, ${y}px)`;
                            target.setAttribute("data-x", x);
                            target.setAttribute("data-y", y);
                        },
                    },
                })
                .draggable({
                    inertia: true,
                    autoScroll: true,
                    allowFrom: "footer > .feather-move",
                    modifiers: [
                        interact.modifiers.restrictRect({
                            restriction: "parent",
                            endOnly: true,
                        }),
                        interact.modifiers.snap({
                            targets: [interact.snappers.grid({ x: 30, y: 30 })],
                            range: Infinity,
                            relativePoints: [{ x: 0, y: 0 }],
                        }),
                    ],
                    listeners: {
                        move(event) {
                            const target = event.target;
                            let x =
                                parseFloat(target.getAttribute("data-x") || 0) +
                                event.dx;
                            let y =
                                parseFloat(target.getAttribute("data-y") || 0) +
                                event.dy;
                            target.style.transform = `translate(${x}px, ${y}px)`;
                            target.setAttribute("data-x", x);
                            target.setAttribute("data-y", y);

                            const line = document.getElementById("svgLine");
                            if (line) {
                                line.setAttribute("x2", `${x}px`);
                                line.setAttribute("y2", `${y}px`);
                            }
                        },
                    },
                });
        </script>
    </body>
</html>
