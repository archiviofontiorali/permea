<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>{{ title | default('app') }}</title>

    <style type="text/tailwindcss">
      #sidebar {
        @apply p-2 bg-slate-700;
      }

      #canvas {
        @apply bg-slate-900;
      }

      button {
        @apply p-1 border-2 bg-slate-500;
      }

      .canvas-node {
        @apply absolute w-fit h-fit min-w-[80px] min-h-[80px];
        @apply rounded-lg border-2 bg-slate-500;
        @apply border-slate-300 hover:border-slate-400 active:border-slate-400;
        @apply touch-none select-none;
      }

      .canvas-node-content {
        @apply flex flex-col;
        @apply p-2 w-full h-full;
      }

      .canvas-node-hook {
        @apply absolute;
      }
      .canvas-node-hook > div {
        min-width: 8px;
        min-height: 8px;
        /* @apply invisible bg-slate-400; */
      }
      .canvas-node-hook:hover > div,
      .canvas-node-hook:active > div {
        @apply visible;
      }

      .canvas-edge {
        stroke: gray;
        stroke-width: 0.25rem;
        stroke-linecap: round;
      }
    </style>

    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
      defer></script>
  </head>

  <body
    class="font-sans w-screen h-screen flex border-4"
    x-data="{show: {desk: true, search: true}}">
    <header
      class="fixed top-0 left-1/2 z-100 bg-slate-500 border-4 divide-x-4 flex flex-row text-lg">
      <ul class="flex flex-row divide-x-4">
        <li x-on:click="show.search=true">
          <i data-feather="search" class="m-2 w-8 h-8">Search</i>
        </li>
        <li x-on:click="show.search=false">
          <i data-feather="layout" class="m-2 w-8 h-8">Canvas</i>
        </li>
        <li class="bg-purple-500" onclick="location.reload()">
          <i data-feather="refresh-cw" class="m-2 w-8 h-8"></i>
        </li>
      </ul>
    </header>
    <aside
      id="sidebar"
      class="z-1 h-full flex flex-col border-e-4 border-black"
      :class="show.desk ? 'w-50' : ''">
      <header class="flex justify-end" x-on:click="show.desk=!show.desk">
        <i data-feather="chevrons-left" class="m-2" x-show="show.desk"></i>
        <i data-feather="chevrons-right" class="m-2" x-show="!show.desk"></i>
      </header>
      <div id="sidebar-desk" class="flex flex-row"></div>
    </aside>

    <main id="canvas" class="relative w-full h-full">
      <svg id="canvas-background" class="absolute w-full h-full">
        <pattern
          id="canvas-background-pattern"
          width="20"
          height="20"
          patternUnits="userSpaceOnUse"
          patternTransform="translate(-0.5, -0.5)">
          <circle cx="0.5" cy="0.5" r="0.5" fill="#90a1b9"></circle>
        </pattern>
        <rect
          width="100%"
          height="100%"
          transform="translate(10, 10)"
          fill="url(#canvas-background-pattern)"></rect>
      </svg>
      <svg id="canvas-edges" class="absolute w-full h-full"></svg>

      <div id="canvas-nodes-container" class="absolute w-full h-full p-[10px]">
        <section id="canvas-nodes" class="w-full h-full"></section>
      </div>
      <div
        id="search"
        class="absolute w-full h-full bg-slate-100 py-16 flex flex-col justify-center items-center"
        :class="show.search ? 'visible' : 'invisible'">
        <section id="search-bar" class="flex flex-row items-center gap-2">
          <input
            class="rounded-full shadow-md inset-shadow-md border-gray-500 border-2 px-4 py-1 border-black bg-slate-200"
            type="text" />
          <button
            class="rounded-full p-2"
            hx-get="/search"
            hx-swap="beforeend"
            hx-target="#search-results">
            <i data-feather="search"></i>
          </button>
        </section>
        <section id="search-results"></section>
      </div>
    </main>

    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src=" https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js "></script>
    <script src="https://unpkg.com/interactjs/dist/interact.min.js"></script>

    <script>
      feather.replace()
    </script>

    <script type="module">
      htmx
        .ajax("POST", "/node/1", {
          target: "#canvas-nodes",
          swap: "beforeend",
        })
        .then(() =>
          htmx.ajax("POST", "/node/2", {
            target: "#canvas-nodes",
            swap: "beforeend",
          })
        )

      const DEFAULT_PRECISION = 20
      const edges = htmx.find("#canvas-edges")

      function round(v, precision = DEFAULT_PRECISION) {
        return Math.round(v / precision) * precision
      }

      /** Move or resize a Node */
      function updateNode(node, dx, dy, width, height) {
        const x = round(parseFloat(node.dataset.x || 0) + (dx || 0))
        const y = round(parseFloat(node.dataset.y || 0) + (dy || 0))
        const w = round(width)
        const h = round(height)

        Object.assign(node.dataset, { x, y })
        Object.assign(node.style, {
          width: `${w}px`,
          height: `${h}px`,
          transform: `translate(${x}px, ${y}px)`,
        })

        edges
          .querySelectorAll(`line[data-head='${node.id}']`)
          .forEach((line) => {
            line.setAttribute("x1", round(x + w / 2 + 8, DEFAULT_PRECISION / 2))
            line.setAttribute("y1", round(y + 9, DEFAULT_PRECISION / 2))
          })

        edges
          .querySelectorAll(`line[data-tail='${node.id}']`)
          .forEach((line) => {
            line.setAttribute("x2", round(x + w / 2 + 8, DEFAULT_PRECISION / 2))
            line.setAttribute("y2", round(y + 9, DEFAULT_PRECISION / 2))
          })
      }

      function createEdge(node) {
        const line = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "line"
        )
        const bbox = event.target.getBoundingClientRect()
        const x = round(
          bbox.x - edges.getBoundingClientRect().x + 8,
          DEFAULT_PRECISION / 2
        )
        const y = round(
          bbox.y - edges.getBoundingClientRect().y + 8,
          DEFAULT_PRECISION / 2
        )

        line.classList.add("canvas-edge")
        line.setAttribute("data-head", node.parentNode.id)
        line.setAttribute("x1", x)
        line.setAttribute("x2", x)
        line.setAttribute("y1", y)
        line.setAttribute("y2", y)

        edges.appendChild(line)
      }

      function find_last_edge(id) {
        const lines = edges.querySelectorAll(`line[data-head='${id}']`)
        return lines[lines.length - 1]
      }

      function moveEdgeTail(node, x, y) {
        const line = find_last_edge(node.id)
        x -= edges.getBoundingClientRect().x
        y -= edges.getBoundingClientRect().y
        line.setAttribute("x2", x)
        line.setAttribute("y2", y)
      }

      function dropEdgeTail(node) {
        const line = find_last_edge(node.id)

        if (!line.getAttribute("data-tail")) {
          line.remove()
          return
        }

        const x = round(line.getAttribute("x2"), DEFAULT_PRECISION / 2)
        const y = round(line.getAttribute("y2"), DEFAULT_PRECISION / 2)

        line.setAttribute("x2", x)
        line.setAttribute("y2", y)
      }

      const { modifiers, snappers } = interact

      const snapToGrid = modifiers.snap({
        targets: [
          snappers.grid({
            x: DEFAULT_PRECISION,
            y: DEFAULT_PRECISION,
          }),
        ],
      })
      const restrictToParent = modifiers.restrictRect({ restriction: "parent" })

      interact("#canvas-nodes .canvas-node")
        .draggable({
          modifiers: [snapToGrid, restrictToParent],
          listeners: {
            move: (e) =>
              updateNode(e.target, e.dx, e.dy, e.rect.width, e.rect.height),
          },
        })
        .resizable({
          edges: { left: true, right: true, bottom: true, top: true },
          ignoreFrom: ".canvas-node-hook",
          modifiers: [snapToGrid, restrictToParent],
          listeners: {
            move: (e) => {
              const { left, top } = e.deltaRect
              updateNode(e.target, left, top, e.rect.width, e.rect.height)
            },
          },
        })

      interact("#canvas-nodes .canvas-node-hook")
        .draggable({
          listeners: {
            start: (e) => createEdge(e.target),
            move: (e) =>
              moveEdgeTail(e.target.parentNode, e.clientX, e.clientY),
            end: (e) => dropEdgeTail(e.target.parentNode, e.clientX, e.clientY),
          },
        })
        .dropzone({
          ondragenter(e) {
            const line = find_last_edge(e.relatedTarget.parentNode.id)
            line.setAttribute("data-tail", e.target.parentNode.id)
          },
          ondragleave(e) {
            const line = find_last_edge(e.relatedTarget.parentNode.id)
            line.removeAttribute("data-tail")
          },
        })

      // interact("#search-results > article.search-result").draggable({
      //   listeners: {
      //     move(event) {
      //       const x = event.clientX
      //       const y = event.clientY
      //       console.log(x, y)
      //       Object.assign(event.target.style, {
      //         transform: `translate(${x}px, ${y}px)`,
      //       })
      //     },
      //   },
      // })
    </script>
  </body>
</html>
