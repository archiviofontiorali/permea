<article
  class="canvas-node"
  style="transform: translate({{ left | default(0) }}px, {{ top | default(0) }}px)"
  id="lod-{{ lod.id }}"
  data-lod="{{ lod.id }}"
  data-x="{{ left | default(0) }}"
  data-y="{{ top | default(0) }}">
  <article class="canvas-node-content">
    <h1>{{ lod.title }}</h1>
    <p class="flex-1">{{ lod.description }}</p>
    <p>This is a node</p>
  </article>

  <div
    class="canvas-node-hook"
    style="left: 0; bottom: 50%; transform: translate(-10px, +8px)">
    <div></div>
  </div>
  <div
    class="canvas-node-hook"
    style="right: 0; bottom: 50%; transform: translate(+10px, 8px)">
    <div></div>
  </div>
  <div
    class="canvas-node-hook"
    style="top: 0; left: 50%; transform: translate(-8px, -10px)">
    <div></div>
  </div>
  <div
    class="canvas-node-hook"
    style="bottom: 0; left: 50%; transform: translate(-8px, +10px)">
    <div></div>
  </div>
</article>
