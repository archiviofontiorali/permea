<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />

        <title>{{ title | default('app') }}</title>

        <script src="https://unpkg.com/feather-icons"></script>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <!-- <link
            rel="stylesheet"
            href="{{ url_for('static', path='/css/main.css') }}"
        /> -->
    </head>

    <body class="font-sans bg-white text-black h-screen flex flex-col">
        <header
            id="header"
            class="border border-darkgray mt-2 mx-2 p-2"
        ></header>

        <main
            id="main"
            class="flex-1 flex flex-row flex-wrap m-2 border border-darkgray"
        >
            <section class="button-group w-full flex flex-row justify-center">
                <button
                    hx-post="/add-row"
                    hx-swap="beforeend"
                    hx-target="#board-search"
                    hx-on::after-request="feather.replace()"
                    class="border-2 p-2 m-1"
                >
                    Add card
                </button>
            </section>

            <section
                id="board-search"
                class="w-full md:w-1/3 min-h-24 flex flex-row md:flex-col bg-green-500"
            ></section>
            <section
                id="board-canvas"
                class="w-full md:w-2/3 min-h-100 bg-blue-500"
            ></section>
        </main>

        <footer id="footer"></footer>

        {% include '_scripts.html' %}
    </body>
</html>
