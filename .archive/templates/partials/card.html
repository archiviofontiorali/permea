<div
  class="canvas-node"
  style="transform: translate({{ left | default(0) }}px, {{ top | default(0) }}px)"
  id="{{ uuid }}"
  data-lod="{{ lod.id }}"
  data-x="{{ left | default(0) }}"
  data-y="{{ top | default(0) }}">
  <article class="canvas-node-content">
    <h1>{{ lod.title }}</h1>
    <p class="flex-1">{{ lod.description }}</p>
    <p class="text-xs">{{ uuid }}</p>
  </article>

  <div
    class="canvas-node-hook top-0 left-1/2"
    style="transform: translate(-8px, -9px)">
    <div
      class="rounded-full bg-slate-500 border-2 border-slate-300 w-[16px] h-[16px]"></div>
  </div>
</div>
