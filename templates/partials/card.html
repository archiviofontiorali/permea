<article
    id="{{ id }}"
    class="card absolute w-50 p-2 flex flex-col bg-slate-500 border-4 border-slate-400 hover:border-slate-300 touch-none select-none"
    style="transform: translate(0px, 0px)"
>
    <h1>Title</h1>
    <p class="flex-1">Description</p>
    <footer class="w-full flex flex-row justify-center">
        <i data-feather="move" class="m-1"></i>
        <i
            data-feather="target"
            class="m-1"
            hx-post="/edge"
            hx-swap="beforeend"
            hx-target="#board-canvas > svg"
            hx-select="svg *"
        ></i>
    </footer>
</article>
