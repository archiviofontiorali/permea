{% for lod in rows %}
<article class="search-result flex flex-row justify-between p-2">
  <p>{{ lod.title }}</p>

  <button
    hx-post="/node/{{lod.id}}"
    hx-swap="beforeend"
    hx-target="#board-canvas"
    hx-on::after-request="feather.replace()"
    class="ma2">
    <i data-feather="plus-circle"></i>
  </button>
</article>
{% endfor %}
