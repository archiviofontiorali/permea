<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>{{ title | default('app') }}</title>

    <style type="text/tailwindcss">
      #sidebar-search {
        @apply p-2 bg-slate-700;
      }

      #canvas {
        @apply bg-slate-900;
      }

      button {
        @apply p-1 border-2 bg-slate-500;
      }

      .canvas-node {
        @apply p-2 w-fit h-fit min-w-[80px] min-h-[80px];
        @apply rounded-lg border-1 border-slate-400 hover:border-slate-300;
        @apply bg-slate-500;
        @apply touch-none select-none;
      }

      .canvas-node-content {
        @apply flex flex-col;
        @apply outline-2 outline-yellow-500;
      }

      .canvas-node-hook {
        @apply absolute;
        @apply w-[1rem] h-[1rem];
        @apply rounded-full border-2 bg-slate-700;
      }
    </style>

    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
      defer></script>
  </head>

  <body
    class="font-sans text-black w-screen h-screen flex flex-row"
    x-data="{show: {search: true}}">
    <section
      id="board-search"
      class="h-full flex flex-col border-4 border-e-2 bg-slate-700 p-2 z-1"
      :class="show.search ? 'w-50' : ''">
      <header
        class="flex flex-row justify-end w-full"
        x-on:click="show.search=!show.search">
        <i data-feather="chevrons-left" class="m-2" x-show="show.search"></i>
        <i data-feather="chevrons-right" class="m-2" x-show="!show.search"></i>
      </header>

      <button
        class="border-2 p-2 bg-slate-500"
        hx-get="/search"
        hx-swap="beforeend"
        hx-target="#search-results"
        hx-on::after-request="feather.replace()">
        Search
      </button>

      <section id="search-results" class="divide-y"></section>
    </section>

    <section
      id="board-canvas"
      class="flex-1 relative h-full bg-slate-900 border-4 border-s-2">
      <svg
        id="board-background"
        class="absolute w-full h-full select-none pointer-events-none z-0">
        <pattern
          id="pattern"
          x="10"
          y="10"
          width="20"
          height="20"
          patternUnits="userSpaceOnUse"
          patternTransform="translate(-0.5, -0.5)">
          <circle cx="0.5" cy="0.5" r="0.5" fill="#90a1b9"></circle>
        </pattern>
        <rect
          x="0"
          y="0"
          width="100%"
          height="100%"
          fill="url(#pattern)"></rect>
      </svg>
      <svg id="board-edges" width="100%" height="100%" class="absolute"></svg>
    </section>

    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src=" https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js "></script>
    <script src="https://unpkg.com/interactjs/dist/interact.min.js"></script>

    <script>
      feather.replace()
    </script>

    <script type="module">
      htmx
        .ajax("POST", "/node/1", {
          target: "#board-canvas",
          swap: "beforeend",
        })
        .then(() => feather.replace())

      /** Move an HTML Element */
      function moveHTMLElement(target, dx, dy) {
        const x = parseFloat(target.getAttribute("data-x") || 0) + dx
        const y = parseFloat(target.getAttribute("data-y") || 0) + dy

        target.style.transform = `translate(${x}px, ${y}px)`
        target.setAttribute("data-x", x)
        target.setAttribute("data-y", y)
      }

      function resizeHTMLElement(target, width, height, dx, dy) {
        const x = parseFloat(target.getAttribute("data-x") || 0) + dx
        const y = parseFloat(target.getAttribute("data-y") || 0) + dy

        target.style.width = `${width}px`
        target.style.height = `${height}px`

        target.style.transform = `translate(${x}px, ${y}px)`

        target.setAttribute("data-x", x)
        target.setAttribute("data-y", y)
      }

      const mods = interact.modifiers
      const snapToGridModifier = interact.modifiers.snap({
        targets: [interact.snappers.grid({ x: 20, y: 20 })],
        offset: { x: 10, y: 10 },
        range: Infinity,
        relativePoints: [{ x: 0, y: 0 }],
      })

      interact("#board-canvas article.canvas-node")
        .draggable({
          autoScroll: false, // Set to true if you want to scroll when out of bound
          inertia: true, // Make the movement smoother
          modifiers: [
            snapToGridModifier,
            mods.restrictRect({ restriction: "parent" }),
          ],
          listeners: {
            move: (e) => moveHTMLElement(e.target, e.dx, e.dy),
          },
        })
        .resizable({
          edges: { left: true, right: true, bottom: true, top: true },
          modifiers: [
            snapToGridModifier,
            mods.restrictSize({ min: { width: 100, height: 100 } }),
            mods.restrictEdges({ outer: "parent" }), // keep the edges inside the parent
          ],
          listeners: {
            move: (e) =>
              resizeHTMLElement(
                e.target,
                e.rect.width,
                e.rect.height,
                e.deltaRect.left,
                e.deltaRect.top
              ),
          },
        })
    </script>

  </body>
</html>
