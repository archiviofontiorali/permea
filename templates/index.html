<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />

        <title>{{ title | default('app') }}</title>

        <script src="https://unpkg.com/feather-icons"></script>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
            defer
        ></script>
    </head>

    <body
        class="font-sans text-black w-screen h-screen flex flex-row"
        x-data="{show: {search: true}}"
    >
        <section
            id="board-search"
            class="h-full flex flex-col border-4 border-e-2 bg-slate-700 p-2"
            :class="show.search ? 'w-50' : ''"
        >
            <header
                class="flex flex-row justify-end w-full"
                x-on:click="show.search=!show.search"
            >
                <i
                    data-feather="chevrons-left"
                    class="m-2"
                    x-show="show.search"
                ></i>
                <i
                    data-feather="chevrons-right"
                    class="m-2"
                    x-show="!show.search"
                ></i>
            </header>

            <button
                hx-post="/add-row"
                hx-swap="beforeend"
                hx-target="#board-search"
                hx-on::after-request="feather.replace()"
                class="border-2 p-2 bg-slate-500"
            >
                Add card
            </button>
        </section>

        <section
            id="board-canvas"
            class="flex-1 relative h-full bg-slate-900 border-4 border-s-2"
        >
            <svg
                id="board-edges"
                width="100%"
                height="100%"
                class="absolute"
            ></svg>
        </section>

        <script src="https://unpkg.com/htmx.org@2.0.4"></script>
        <script src=" https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js "></script>
        <script src="https://unpkg.com/interactjs/dist/interact.min.js"></script>

        <script>
            feather.replace();
        </script>

        <script type="module">
            const canvas = document.getElementById("board-canvas");

            interact("#board-canvas > .card")
                .resizable({
                    // inertia: true,
                    edges: { left: true, right: true, bottom: true, top: true },
                    modifiers: [
                        // keep the edges inside the parent
                        interact.modifiers.restrictEdges({
                            outer: "parent",
                        }),

                        // minimum size
                        interact.modifiers.restrictSize({
                            min: { width: 100, height: 50 },
                        }),
                    ],
                    listeners: {
                        move(event) {
                            const target = event.target;
                            let x =
                                parseFloat(target.getAttribute("data-x") || 0) +
                                event.deltaRect.left;
                            let y =
                                parseFloat(target.getAttribute("data-y") || 0) +
                                event.deltaRect.top;

                            target.style.width = `${event.rect.width}px`;
                            target.style.height = `${event.rect.height}px`;

                            target.style.transform = `translate(${x}px, ${y}px)`;
                            target.setAttribute("data-x", x);
                            target.setAttribute("data-y", y);
                        },
                    },
                })
                .draggable({
                    inertia: true,
                    autoScroll: true,
                    allowFrom: "footer > .feather-move",
                    modifiers: [
                        interact.modifiers.restrictRect({
                            restriction: "parent",
                            endOnly: true,
                        }),
                        interact.modifiers.snap({
                            targets: [interact.snappers.grid({ x: 30, y: 30 })],
                            range: Infinity,
                            relativePoints: [{ x: 0, y: 0 }],
                        }),
                    ],
                    listeners: {
                        move(event) {
                            const target = event.target;
                            let x =
                                parseFloat(target.getAttribute("data-x") || 0) +
                                event.dx;
                            let y =
                                parseFloat(target.getAttribute("data-y") || 0) +
                                event.dy;
                            target.style.transform = `translate(${x}px, ${y}px)`;
                            target.setAttribute("data-x", x);
                            target.setAttribute("data-y", y);

                            const line = document.getElementById("svgLine");
                            if (line) {
                                line.setAttribute("x2", `${x}px`);
                                line.setAttribute("y2", `${y}px`);
                            }
                        },
                    },
                });
        </script>
    </body>
</html>
