<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document</title>
  
  <link rel="stylesheet" href="https://unpkg.com/tachyons@4.12.0/css/tachyons.min.css"/>
 
  <style>
    .node {
        background-color: lime;
    }
    
    ul {
        list-style-type: none; /* Remove bullets */
        padding: 0; /* Remove padding */
        margin: 0; /* Remove margins */
    }
    ul > li { outline: 1px solid black; padding: 0.5rem; }  
  </style>

  <script type="importmap">
    {
        "imports": {
            "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
        }
    }
  </script>
</head>
<body>
  <!-- main -->

  <div id="app">{{ message }}</div>
  <div id="graph" style="outline: 1px solid black; min-height: 50vh"></div>
  
  <!-- javascript -->

  <script type="module">
    import cytoscape from 'https://cdn.jsdelivr.net/npm/cytoscape@3.31.0/+esm'
    import cytoscapeDomNode from 'https://cdn.jsdelivr.net/npm/cytoscape-dom-node@1.2.0/+esm' 
    import cytoscapeCxtmenu from 'https://cdn.jsdelivr.net/npm/cytoscape-cxtmenu@3.5.0/+esm'

    cytoscape.use(cytoscapeDomNode);
    cytoscape.use(cytoscapeCxtmenu);

    const nodes = [
      { id: 'a', label: 'alpha' },
      { id: 'b', label: 'beta' },
      { id: 'c', label: 'gamma' },
      { id: 'd', label: 'delta' },
    ]

    const style = [
        { selector: "node", style: {} },
    ];

    const layout = {name: "cose"};

    const cy = cytoscape(
        {
            container: document.getElementById('graph'),
            elements: [],
            style: style,
            layout: layout
        }
    )
    
    cy.domNode();

    function add_node(node) {
        let div = document.createElement("div");
        div.className = "node";
        div.innerHTML = `
        <ul>
          <li>${node.id}</li>
          <li>${node.label}</li>
        </ul>
        `
        cy.add({data: {id: node.id, dom: div}})
    }

    nodes.forEach(add_node);
    cy.layout(layout).run();

    // cy.cxtmenu(cytoscapeCxtmenu.defaults);
    
  </script>


  <script type="module">
      import { createApp } from "vue";

      createApp({
          data() {
              return {
                  message: "Hello Vue!",
              };
          },
      }).mount("#app");
  </script>
</body>
</html>
