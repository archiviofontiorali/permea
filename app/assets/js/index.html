<div id="app">{{ message }}</div>
<div id="graph" style="outline: 1px solid black; min-height: 50vh"></div>

<script
    type="text/javascript"
    charset="utf8"
    src="https://unpkg.com/cytoscape@3.31.0/dist/cytoscape.min.js"
></script>
<script
    type="text/javascript"
    charset="utf8"
    src="https://unpkg.com/cytoscape-dom-node@1.2.0/src/index.js"
></script>

<script type="module">
    // import cytoscape from "https://unpkg.com/cytoscape@3.31.0/dist/cytoscape.esm.mjs";

    // cytoscope.use(cytoscapeDomNode);

    const data = [
        { data: { id: "a" } },
        { data: { id: "b" } },
        { data: { id: "c" } },
        { data: { id: "e" } },
        { data: { id: "f" } },
        { data: { id: "ab", source: "a", target: "b" } },
        { data: { id: "ce", source: "c", target: "e" } },
        { data: { id: "be", source: "b", target: "e" } },
    ];

    const style = [
        {
            selector: "node",
            style: { label: "data(id)" },
        },
        { selector: "node", style: {} },
    ];

    const layout = { name: "cose" };

    const cy = cytoscape({
        container: document.getElementById("graph"),
        elements: data,
        style: style,
        layout: layout,
    });

    cy.domNode();

    // let id = "a";
    // let div = document.createElement("div");
    // div.innerHTML = `node ${id}`;
    // div.style = "color: black";

    // cy.add({ data: { id: id, dom: div } });
</script>

<script type="module">
    import { createApp } from "vue";

    createApp({
        data() {
            return {
                message: "Hello Vue!",
            };
        },
    }).mount("#app");
</script>
