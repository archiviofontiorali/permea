<article
    id="{{ id }}"
    class="w-full border-2 p-2 my-2 flex flex-row justify-between"
>
    <div>
        <h4>Name Surname</h4>
        <p>Description</p>
    </div>
    <button
        hx-post="/add-card"
        hx-swap="beforeend"
        hx-target="#board-canvas"
        hx-on::after-request="feather.replace()"
        class="ma2"
    >
        <i data-feather="plus-circle"></i>
    </button>
</article>
